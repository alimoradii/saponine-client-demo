name: Check Iran host

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for valid custom-domain TLS
        shell: bash
        run: |
          set -u
          url='https://saponin.216-24-57-1.sslip.io/'
          for attempt in $(seq 1 24); do
            rm -f /tmp/body.html /tmp/headers.txt
            code="$(curl -L --connect-timeout 15 --max-time 45 -sS -D /tmp/headers.txt -o /tmp/body.html -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt code=$code"
            if [ "$code" = "200" ] && grep -a -q 'saponine-host-mode' /tmp/body.html; then
              echo "CUSTOM_DOMAIN_READY=$url"
              cat /tmp/headers.txt
              exit 0
            fi
            sleep 10
          done
          echo 'Custom domain TLS was not ready during this verification window.'
          exit 1
