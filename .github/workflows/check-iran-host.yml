name: Check Iran host

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HTTPS from Iran nodes
        shell: bash
        run: |
          set -euo pipefail
          target='https://saponin.216-24-57-1.sslip.io/'
          dispatch="$(curl -sS -G -H 'Accept: application/json' \
            --data-urlencode "host=$target" \
            --data-urlencode 'node=ir1.node.check-host.net' \
            --data-urlencode 'node=ir2.node.check-host.net' \
            --data-urlencode 'node=ir3.node.check-host.net' \
            --data-urlencode 'node=ir4.node.check-host.net' \
            --data-urlencode 'node=ir5.node.check-host.net' \
            --data-urlencode 'node=ir6.node.check-host.net' \
            --data-urlencode 'node=ir7.node.check-host.net' \
            --data-urlencode 'node=ir8.node.check-host.net' \
            'https://check-host.net/check-http')"
          echo "$dispatch" | jq .
          request_id="$(echo "$dispatch" | jq -r '.request_id // empty')"
          test -n "$request_id"

          report='{}'
          for attempt in $(seq 1 20); do
            sleep 2
            report="$(curl -sS -H 'Accept: application/json' "https://check-host.net/check-result/$request_id")"
            reported="$(echo "$report" | jq '[to_entries[] | select(.value != null)] | length')"
            echo "attempt=$attempt reported=$reported"
            if [ "$reported" -ge 8 ]; then
              break
            fi
          done

          echo "$report" | jq .
          success="$(echo "$report" | jq '[to_entries[] | .value[]? | select((.[0] == 1) and ((.[3] | tostring) == "200"))] | length')"
          echo "IRAN_HTTP_200_NODES=$success"
          echo "IRAN_REPORT=https://check-host.net/check-report/$request_id"
          test "$success" -ge 4
