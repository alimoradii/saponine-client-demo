name: Check Iran host

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHubRaw delivery from Iran
        shell: bash
        run: |
          set -u
          target='https://cdn.githubraw.com/alimoradii/saponine-client-demo/2bb7531bdc5321434c88c354abc2aa146d52341b/index.html'

          rm -f /tmp/body /tmp/headers
          direct="$(curl -L --connect-timeout 15 --max-time 45 -sS -D /tmp/headers -o /tmp/body -w 'code=%{http_code} type=%{content_type}' "$target" || true)"
          echo "DIRECT $direct"
          grep -a -q 'saponine-host-mode' /tmp/body || { echo 'marker missing'; exit 1; }

          dispatch=''
          request_id=''
          for dispatch_attempt in $(seq 1 5); do
            dispatch="$(curl -sS -G -H 'Accept: application/json' \
              --data-urlencode "host=$target" \
              --data-urlencode 'node=ir1.node.check-host.net' \
              --data-urlencode 'node=ir2.node.check-host.net' \
              --data-urlencode 'node=ir3.node.check-host.net' \
              --data-urlencode 'node=ir6.node.check-host.net' \
              'https://check-host.net/check-http' || true)"
            request_id="$(printf '%s' "$dispatch" | jq -r '.request_id // empty' 2>/dev/null || true)"
            [ -n "$request_id" ] && break
            echo "dispatch attempt $dispatch_attempt failed: $dispatch"
            sleep 5
          done
          test -n "$request_id"
          echo "IRAN_REPORT=https://check-host.net/check-report/$request_id"

          report='{}'
          for attempt in $(seq 1 20); do
            sleep 2
            report="$(curl -sS -H 'Accept: application/json' "https://check-host.net/check-result/$request_id" || echo '{}')"
            reported="$(printf '%s' "$report" | jq '[to_entries[] | select(.value != null)] | length' 2>/dev/null || echo 0)"
            echo "attempt=$attempt reported=$reported"
            [ "$reported" -ge 4 ] && break
          done
          echo "$report" | jq . || true
          success="$(printf '%s' "$report" | jq '[to_entries[] | .value[]? | select((.[0] == 1) and ((.[3] | tostring) == "200"))] | length' 2>/dev/null || echo 0)"
          echo "IRAN_HTTP_200_NODES=$success"
          test "$success" -ge 2
