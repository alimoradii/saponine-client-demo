name: Verify Render badge removal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-render-badge.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed version and injected cleanup
        shell: bash
        run: |
          set -euo pipefail
          base='https://saponin-motion-showcase.onrender.com'
          health=''
          for attempt in $(seq 1 12); do
            health="$(curl -fsSL --connect-timeout 15 --max-time 45 "$base/__health" || true)"
            if printf '%s' "$health" | grep -q '2026-11-10-3'; then
              break
            fi
            sleep 5
          done
          echo "$health"
          printf '%s' "$health" | grep -q '2026-11-10-3'
          printf '%s' "$health" | grep -q '"lovableBadge":"removed"'

          curl -fsSL --connect-timeout 15 --max-time 45 "$base/" -o /tmp/index.html
          grep -q '/__adrian/brand-cleanup.css' /tmp/index.html
          grep -q '/__adrian/brand-cleanup.js' /tmp/index.html
          curl -fsSI "$base/__adrian/brand-cleanup.css" | grep -qi 'content-type: text/css'
          curl -fsSI "$base/__adrian/brand-cleanup.js" | grep -qi 'content-type: application/javascript'

      - name: Verify rendered DOM in Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom \
            'https://saponin-motion-showcase.onrender.com/?badge-verification=20261110' \
            > /tmp/rendered.html

          grep -a -q 'saponine-render-mode' /tmp/rendered.html
          if grep -a -Eqi 'Edit[[:space:]]+with[[:space:]]+Lovable|id="lovable-badge"|data-lovable-badge'; then
            echo 'Lovable badge is still present in the rendered DOM.'
            exit 1
          fi
          echo 'Rendered DOM is clean: Lovable editor badge is absent.'
